<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loja de Materiais de Construção</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c2410c'/%3E%3Cpath d='M5 8h14v8H5zM5 12h14M12 8v4M8.5 12v4M15.5 12v4' stroke='white' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
  <script>
    try { var t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="veu" id="veu"></div>
    <div class="main">
      <header class="topbar">
        <button class="btn icone fantasma menu-btn" id="menu-btn" title="Menu" aria-label="Abrir menu"></button>
        <div class="titulo"><h1 id="titulo-pagina"></h1><div class="sub" id="sub-pagina"></div></div>
        <div class="direita">
          <span class="relogio" id="relogio"></span>
          <button class="btn icone fantasma" id="tema-btn" title="Alternar tema claro/escuro" aria-label="Alternar tema"></button>
          <a class="btn primario esconder-m" href="#pdv" id="btn-nova-venda"></a>
        </div>
      </header>
      <main class="conteudo" id="conteudo"></main>
    </div>
  </div>
  <div id="modal" class="oculto" role="dialog" aria-modal="true">
    <div class="janela"><header><h2 id="modal-titulo"></h2><button class="btn icone fantasma" id="modal-fechar" title="Fechar (Esc)" aria-label="Fechar"></button></header>
      <div id="modal-corpo"></div></div>
  </div>
  <div id="avisos" aria-live="polite"></div>
  <div id="impressao"></div>
  <script src="/extenso.js"></script>
  <script src="/app.js"></script>
</body>
</html>
